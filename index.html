<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mesa virtual para o RPG Into the Madness: campanhas, fichas, rolagens e área do mestre.">
<title>Into the Madness VTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: dossiê de investigação — barra superior fixa, conteúdo em colunas que viram uma só no celular; fichas como pastas de arquivo. */
:root{
  --bg:#0c110f; --bg-2:#131a17; --bg-3:#1a231f; --bg-4:#222d28; --line:#2e3b35; --line-2:#3e4d45;
  --fg:#f1ecdc; --muted:#c4cabb; --faint:#a1a996;
  --accent:#95c9a3; --accent-2:#6fae84; --accent-ink:#0c110f;
  --brass:#d6b268; --blood:#e3796b; --ether:#bba8ea; --ok:#95c9a3;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --f-display:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --f-title:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Courier Prime','Courier New',ui-monospace,monospace;
  --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#e9e1cc; --bg-2:#f4eee0; --bg-3:#e0d6bd; --bg-4:#d5c9ab; --line:#c5b893; --line-2:#ac9e78;
  --fg:#16130d; --muted:#4a4334; --faint:#5f5644;
  --accent:#2c6643; --accent-2:#245537; --accent-ink:#f4eee0;
  --brass:#7f5a12; --blood:#9e3326; --ether:#553f91; --ok:#2c6643;
  --shadow:0 10px 26px rgba(60,45,20,.22);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#e9e1cc; --bg-2:#f4eee0; --bg-3:#e0d6bd; --bg-4:#d5c9ab; --line:#c5b893; --line-2:#ac9e78;
  --fg:#16130d; --muted:#4a4334; --faint:#5f5644;
  --accent:#2c6643; --accent-2:#245537; --accent-ink:#f4eee0;
  --brass:#7f5a12; --blood:#9e3326; --ether:#553f91; --ok:#2c6643;
  --shadow:0 10px 26px rgba(60,45,20,.22);
  color-scheme:light;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:19px; line-height:1.6; font-weight:450; font-optical-sizing:auto;
  background-image:
    radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--ether) 7%, transparent), transparent 70%);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg-2)}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(2.1rem,5vw,3.2rem)} h2{font-size:clamp(1.6rem,3.4vw,2.1rem)} h3{font-size:1.4rem} h4{font-size:1.15rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.label,label.lbl{font-family:var(--f-ui);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:.45em 1.05em;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-3);color:var(--fg);cursor:pointer;font-family:var(--f-ui);font-size:1.02rem;font-weight:700;line-height:1.2;text-decoration:none;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--bg-4);border-color:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{border-color:color-mix(in srgb,var(--blood) 60%,var(--line));color:var(--blood);background:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--blood) 14%,transparent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg-3);border-color:var(--line)}
.btn.sm{min-height:38px;font-size:.92rem;padding:.3em .75em}
.btn.xs{min-height:32px;font-size:.85rem;padding:.2em .6em;font-weight:500}
.btn.icon{min-width:44px;padding:0 .6em}
.btn.roll{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.btn.roll:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
input[type=text],input[type=password],input[type=number],input:not([type]),select,textarea{
  width:100%;min-height:46px;padding:.45em .7em;border-radius:var(--r);border:1px solid var(--line-2);
  background:var(--bg);color:var(--fg);font-size:1.05rem;font-family:var(--f-ui);}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[readonly],textarea[readonly],select:disabled,input:disabled{opacity:.85;border-style:dashed}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.lg{gap:24px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.2em .7em;border-radius:99px;border:1px solid var(--line-2);font-size:.98rem;font-family:var(--f-ui);background:var(--bg-3)}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:0 2px}
.chip button:hover{color:var(--blood)}
.pill{display:inline-block;font-family:var(--f-ui);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:.15em .6em;border-radius:99px;border:1px solid currentColor}
.pill.mestre{color:var(--brass)} .pill.jogador{color:var(--accent)} .pill.npc{color:var(--blood)}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* ---------- shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg-2) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:64px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--fg);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px;color:var(--accent)}
.theme-btn svg{width:22px;height:22px}
.topbar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--muted);font-family:var(--f-ui)}
.who b{color:var(--fg);font-weight:600}
main{padding-block:28px 120px}
.banner-local{background:color-mix(in srgb,var(--brass) 14%,var(--bg-2));border-bottom:1px solid color-mix(in srgb,var(--brass) 40%,var(--line));color:var(--fg);font-size:.95rem}
.banner-local .wrap{padding-block:8px}

/* ---------- login ---------- */
.login{min-height:calc(100vh - 40px);display:grid;grid-template-columns:1.1fr 1fr;gap:0;align-items:stretch}
.login-art{position:relative;overflow:hidden;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:48px max(16px,env(safe-area-inset-left,0px)) 48px 48px;background:
  radial-gradient(circle at 50% 38%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 55%), var(--bg-2)}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.login-art .copy{position:relative;max-width:30ch}
.login-art h1{font-size:clamp(2.8rem,6vw,4.6rem);line-height:.95;color:var(--fg)}
.login-art h1 em{display:block;font-family:var(--f-title);font-style:italic;color:var(--accent);font-size:.55em;letter-spacing:.02em;margin-bottom:.2em}
.login-art p{color:var(--muted);margin-top:14px;font-size:1.1rem}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.login-card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{min-height:48px;background:transparent;border:0;cursor:pointer;font-family:var(--f-ui);font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--bg-4);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.err{color:var(--blood);font-size:.95rem;min-height:1.4em}
.note{font-size:.95rem;color:var(--muted)}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{min-height:300px;border-right:0;border-bottom:1px solid var(--line);padding:32px max(16px,env(safe-area-inset-left,0px))}}

/* ---------- home ---------- */
.hero-home{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.hero-home .k{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:thin}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;font-family:var(--f-ui);font-weight:700;font-size:1.08rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button .count{font-family:var(--f-mono);font-size:.8rem;background:var(--bg-3);border:1px solid var(--line);border-radius:99px;padding:0 .5em}
.tabs.small button{font-size:1rem;padding:10px 14px}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:22px}
.camp{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.camp:hover{border-color:var(--line-2)}
.cover{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--bg-3);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);background:
  repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb,var(--line) 45%,transparent) 14px 15px), var(--bg-3)}
.cover .ph svg{width:72px;height:72px;opacity:.6;color:var(--accent)}
.camp .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.camp h3{font-size:1.5rem}
.camp .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.camp .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.empty{border:1px dashed var(--line-2);border-radius:10px;padding:34px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{color:var(--fg)}

/* ---------- campaign ---------- */
.camp-head{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:26px;align-items:end;margin-bottom:24px}
.camp-head .cover{border-radius:10px;border:1px solid var(--line)}
.camp-head .info{display:flex;flex-direction:column;gap:10px;min-width:0}
.camp-head .back{align-self:flex-start}
@media (max-width:760px){.camp-head{grid-template-columns:1fr}}
.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel h3 small{font-family:var(--f-ui);font-size:.95rem;color:var(--muted);margin-left:6px}
.code-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:2.2rem;letter-spacing:.28em;color:var(--brass);background:var(--bg);border:1px dashed var(--line-2);border-radius:var(--r);padding:.1em .5em .1em .7em;user-select:all}
.master-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
@media (max-width:980px){.span4,.span5,.span6,.span7,.span8{grid-column:span 12}}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap}
.list .it:first-child{border-top:0}
.list .it .grow{flex:1;min-width:160px}
.list .it .t{font-weight:600;font-size:1.08rem}
.list .it .s{color:var(--muted);font-size:.9rem}
.list .it.off{opacity:.55}
.list .it.off .t{text-decoration:line-through}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px}
.char{text-align:left;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;color:var(--fg)}
.char:hover{border-color:var(--accent-2)}
.char::after{content:"";position:absolute;top:-1px;right:22px;width:70px;height:10px;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--bg-3)}
.char h3{font-size:1.45rem}
.char .sub{color:var(--muted);font-size:1rem}
.meters{display:flex;flex-direction:column;gap:6px}
.meter{display:grid;grid-template-columns:92px 1fr 60px;align-items:center;gap:8px;font-size:.92rem}
.meter .bar{height:8px;border-radius:99px;background:var(--bg-4);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--blood)}
.meter.san .bar i{background:var(--ether)}
.meter .num{text-align:right;color:var(--muted)}
.create-card{border-style:dashed;align-items:flex-start;justify-content:center;min-height:180px}
.create-card::after{display:none}

/* dice roller */
.dice-quick{display:flex;flex-wrap:wrap;gap:8px}
.die-btn{min-width:62px;min-height:52px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-3);cursor:pointer;font-family:var(--f-mono);font-weight:700;font-size:1.05rem}
.die-btn:hover{border-color:var(--accent);color:var(--accent)}
.die-btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.result .total{font-family:var(--f-mono);font-size:2.6rem;font-weight:700;line-height:1}
.result .det{font-family:var(--f-mono);color:var(--muted);font-size:.95rem;word-break:break-word}
.dice-faces{display:flex;flex-wrap:wrap;gap:6px}
.face{min-width:36px;height:36px;padding:0 6px;display:inline-grid;place-items:center;border:1px solid var(--line-2);border-radius:5px;font-family:var(--f-mono);font-weight:700;background:var(--bg-3)}
.face.max{border-color:var(--brass);color:var(--brass)}
.face.min{border-color:var(--blood);color:var(--blood)}
.face.drop{opacity:.4;text-decoration:line-through}
.face.nef{border-radius:50%;border-style:double;border-width:3px}

/* ---------- sheet ---------- */
.sheet{display:flex;flex-direction:column;gap:20px}
.sheet-top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
@media (max-width:760px){.sheet-top{grid-template-columns:1fr}}
.sheet-name input{font-family:var(--f-display);font-size:clamp(1.8rem,4vw,2.6rem);background:transparent;border:0;border-bottom:1px dashed var(--line-2);border-radius:0;padding:0 0 4px;min-height:auto}
.sheet-name input:focus{box-shadow:none;border-bottom-color:var(--accent)}
.rollbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:30;background:color-mix(in srgb,var(--bg-2) 96%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.rollbar .seg{grid-template-columns:repeat(3,auto)}
.rollbar .seg button{min-height:40px;padding:0 12px;font-size:.92rem}
.rollbar select{width:auto;min-height:40px}
.rollbar label.tog{display:flex;align-items:center;gap:8px;font-size:.95rem;cursor:pointer}
.sec{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec>h3{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.sheet-cols{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:start}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.attrs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.attr{border:1px solid var(--line-2);border-radius:10px;background:var(--bg);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.attr .nm{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.attr .val{font-family:var(--f-mono);font-size:2.3rem;font-weight:700;line-height:1}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg-3);cursor:pointer;font-size:1.2rem;line-height:1}
.stepper button:hover{border-color:var(--accent)}
.stepper input{width:70px;text-align:center;min-height:40px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.vital{border:1px solid var(--line-2);border-radius:10px;background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.vital .head{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.vital .big{font-family:var(--f-mono);font-size:1.9rem;font-weight:700}
.vital .big small{font-size:1rem;color:var(--muted);font-weight:400}
.vital.hp .big{color:var(--blood)} .vital.san .big{color:var(--ether)} .vital.det .big{color:var(--brass)}
.vital .bar{height:10px;border-radius:99px;background:var(--bg-4);overflow:hidden}
.vital .bar i{display:block;height:100%;background:var(--blood);transition:width .3s}
.vital.san .bar i{background:var(--ether)}
.vital .ctr{display:flex;gap:6px;align-items:center}
.vital .ctr input{min-height:38px;padding:.2em .4em;text-align:center}
.saves{display:flex;flex-direction:column;gap:8px}

function openModal({title,body,footer='',wide=false,onMount,onClose}){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><header><h3>${esc(title)}</h3><button class="btn ghost icon" data-x aria-label="Fechar">✕</button></header><div class="mb">${body}</div>${footer?`<footer>${footer}</footer>`:''}</div>`;
  const close=()=>{bg.remove();onClose&&onClose()};
  bg.addEventListener('mousedown',e=>{if(e.target===bg)bg._down=true});
  bg.addEventListener('click',e=>{if((e.target===bg&&bg._down)||e.target.closest('[data-x]'))close();bg._down=false});
  document.body.appendChild(bg);
  const m={el:bg,close,body:$('.mb',bg),foot:$('footer',bg)};
  onMount&&onMount(m);
  const f=$('input,select,textarea',bg);f&&setTimeout(()=>f.focus(),30);
  return m;
}

}

function parseDice(expr){
  const s=String(expr||'').replace(/[\u2212\u2013\u2014]/g,'-').replace(/\s+/g,'').toLowerCase().replace(/^\+/,'');
  if(!s||!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s))return null;
  const terms=s.match(/[+-]?(\d*d\d+|\d+)/g);const faces=[],mods=[];let total=0,count=0;
  for(const t of terms){
    const neg=t[0]==='-';const body=t.replace(/^[+-]/,'');
    if(body.includes('d')){let[n,sd]=body.split('d');n=n===''?1:+n;sd=+sd;if(n<1||sd<2||sd>1000)return null;count+=n;if(count>100)return null;
      for(let i=0;i<n;i++){const v=rnd(sd);faces.push({v,s:sd,neg});total+=neg?-v:v}}
    else{const v=+body*(neg?-1:1);mods.push(['',v]);total+=v}
  }
  return{faces,mods,total};
}

function rollBody(r){
  const tags=[];
  if(r.outcome)tags.push(`<span class="tag ${r.outcome}">${OUT[r.outcome][0]}</span>`);
  if(r.success===true)tags.push(`<span class="tag ok">Sucesso</span>`);
  if(r.success===false)tags.push(`<span class="tag fail">Falha</span>`);
  if(r.kind==='test'&&r.nat===20)tags.push(`<span class="tag triunfo">20 natural</span>`);

function drawAbyss(cv){
  if(!cv)return;const ctx=cv.getContext('2d');let w,h,raf;const dpr=Math.min(2,devicePixelRatio||1);
  const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.8,r:Math.random()*1.4+.3,p:Math.random()*6}));
  const tent=Array.from({length:7},(_,i)=>({x:.08+i*.14+Math.random()*.05,len:.35+Math.random()*.35,ph:Math.random()*6,sp:.25+Math.random()*.35,wd:6+Math.random()*10}));
  const size=()=>{const r=cv.getBoundingClientRect();w=r.width;h=r.height;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t){
    if(!cv.isConnected){cancelAnimationFrame(raf);return}
    t=(t||0)/1000;ctx.clearRect(0,0,w,h);const acc=css('--accent'),fg=css('--fg'),eth=css('--ether');
    ctx.fillStyle=fg;for(const s of stars){ctx.globalAlpha=.25+.35*Math.abs(Math.sin(t*.6+s.p));ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,7);ctx.fill()}
    const ex=w*.62,ey=h*.34,er=Math.min(w,h)*.16;ctx.globalAlpha=.55;ctx.strokeStyle=acc;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(ex,ey,er*1.7,er*(.55+.12*Math.sin(t*.7)),0,0,7);ctx.stroke();
    ctx.globalAlpha=.8;ctx.fillStyle=acc;ctx.beginPath();ctx.arc(ex+Math.sin(t*.4)*er*.35,ey,er*.28,0,7);ctx.fill();
    ctx.fillStyle=css('--bg-2');ctx.beginPath();ctx.ellipse(ex+Math.sin(t*.4)*er*.35,ey,er*.06,er*.22,0,0,7);ctx.fill();
    for(const k of tent){const bx=k.x*w;ctx.beginPath();const steps=30;ctx.globalAlpha=.32;ctx.strokeStyle=eth;
      for(let i=0;i<=steps;i++){const q=i/steps;const y=h-q*k.len*h;const x=bx+Math.sin(q*4+t*k.sp+k.ph)*q*48;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.lineWidth=k.wd;ctx.lineCap='round';ctx.stroke();ctx.lineWidth=k.wd*.3;ctx.globalAlpha=.5;ctx.strokeStyle=acc;ctx.stroke()}
    ctx.globalAlpha=1;if(!still)raf=requestAnimationFrame(frame);
  }
  size();addEventListener('resize',size);frame(0);
}

const coverCache={};
const PH=`<div class="ph">${SIGIL}</div>`;
function coverInner(code,v){
  if(!v)return PH;const cc=coverCache[code];
  if(cc&&cc.v===v)return cc.img?`<img alt="" src="${cc.img}">`:PH;
  loadCover(code,v);return cc&&cc.img?`<img alt="" src="${cc.img}">`:PH;
}
async function loadCover(code,v){
  const cc=coverCache[code]||(coverCache[code]={});if(cc.loading===v)return;cc.loading=v;
  const d=await Store.get('covers/'+code).catch(()=>null);
  coverCache[code]={v,img:d&&d.img||null};
  $$(`[data-cover="${code}"]`).forEach(el=>el.innerHTML=coverInner(code,v));
}

function joinModal(){

async function delCamp(code){
  const c=[...st.home.master,st.camp].find(x=>x&&x.code===code);
  if(!(await confirmBox({title:'Deletar campanha?',text:`Isso apaga “${esc(c?c.name:code)}” com todas as fichas, NPCs, rolagens e recompensas. Não dá para desfazer.`,ok:'Deletar para sempre'})))return;
  try{
    for(const coll of ['sheets','rolls','rewards']){const rows=await Store.query(coll,[['campaign','==',code]]);for(const r of rows)await Store.del(coll+'/'+r._id)}
    await Store.del('covers/'+code).catch(()=>{});await Store.del('campaigns/'+code);
    toast('Campanha deletada.');if(st.view!=='home')viewHome();
  }catch(e){toast(errMsg(e),'err')}
}

async function coverEditor(code){
  const W=1280,H=720;let img=null,zoom=1,ox=0,oy=0;
  const m=openModal({title:'Capa da campanha',wide:true,body:`<p class="hint">Proporção 16:9. Arraste a imagem para enquadrar e use o zoom para ajustar.</p>
  <div class="crop" id="cr-box"><canvas id="cr-cv" width="${W}" height="${H}"></canvas></div>
  <div class="row"><label class="btn" for="cr-f">Escolher imagem</label><input id="cr-f" type="file" accept="image/*" hidden>
  <div class="field" style="flex:1;min-width:180px"><label class="lbl" for="cr-z">Zoom</label><input id="cr-z" type="range" min="1" max="4" step="0.01" value="1"></div></div><div class="err" id="cr-e"></div>`,
  footer:`<button class="btn danger" id="cr-rm">Remover capa</button><span style="flex:1"></span><button class="btn" data-x>Cancelar</button><button class="btn primary" id="cr-ok">Salvar capa</button>`});
  const cv=$('#cr-cv',m.el),ctx=cv.getContext('2d');
  const base=()=>img?Math.max(W/img.width,H/img.height):1;
  const lim=()=>{const s=base()*zoom;const mx=Math.max(0,(img.width*s-W)/2),my=Math.max(0,(img.height*s-H)/2);ox=clamp(ox,-mx,mx);oy=clamp(oy,-my,my)};
  const draw=(c=ctx,w=W,h=H)=>{c.fillStyle='#111';c.fillRect(0,0,w,h);if(!img){c.fillStyle='#777';c.font='40px Georgia';c.textAlign='center';c.fillText('Escolha uma imagem',w/2,h/2);return}
    lim();const k=w/W,s=base()*zoom*k;c.drawImage(img,w/2-img.width*s/2+ox*k,h/2-img.height*s/2+oy*k,img.width*s,img.height*s)};
  const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>{img=i;zoom=1;ox=oy=0;$('#cr-z',m.el).value=1;draw();r()};i.onerror=()=>{$('#cr-e',m.el).textContent='Não consegui abrir essa imagem.';r()};i.src=src});
  const cur=coverCache[code];if(cur&&cur.img)await load(cur.img);else{const d=await Store.get('covers/'+code).catch(()=>null);if(d&&d.img)await load(d.img);else draw()}
  $('#cr-f',m.el).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsDataURL(f)};
  $('#cr-z',m.el).oninput=e=>{zoom=+e.target.value;draw()};
  let drag=null;const box=$('#cr-box',m.el);
  box.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy};box.setPointerCapture(e.pointerId)});
  box.addEventListener('pointermove',e=>{if(!drag)return;const k=W/box.getBoundingClientRect().width;ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;draw()});
  box.addEventListener('pointerup',()=>drag=null);box.addEventListener('pointercancel',()=>drag=null);
  box.addEventListener('wheel',e=>{if(!img)return;e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.06:.94),1,4);$('#cr-z',m.el).value=zoom;draw()},{passive:false});
  $('#cr-ok',m.el).onclick=async()=>{
    if(!img)return $('#cr-e',m.el).textContent='Escolha uma imagem primeiro.';
    let out,sizes=[[1280,720,.82],[1280,720,.7],[960,540,.72],[800,450,.68],[640,360,.62]];
    for(const[w,h,q]of sizes){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);out=c.toDataURL('image/jpeg',q);if(out.length<230000)break}
    try{$('#cr-ok',m.el).disabled=true;const v=Date.now();await Store.set('covers/'+code,{img:out,campaign:code});coverCache[code]={v,img:out};await Store.update('campaigns/'+code,{coverV:v});m.close();toast('Capa salva.','ok')}
    catch(e){$('#cr-e',m.el).textContent=errMsg(e);$('#cr-ok',m.el).disabled=false}
  };
  $('#cr-rm',m.el).onclick=async()=>{try{await Store.del('covers/'+code);await Store.update('campaigns/'+code,{coverV:0});delete coverCache[code];m.close();toast('Capa removida.')}catch(e){toast(errMsg(e),'err')}};
}

const fb={};
function clean(o){const r={};for(const k in o){if(k[0]!=='_'&&o[k]!==undefined)r[k]=o[k]}return JSON.parse(JSON.stringify(r))}
/* Firestore não aceita listas dentro de listas: embrulha como {__arr:[...]} ao gravar e desembrulha ao ler */
function enc(v){if(Array.isArray(v))return v.map(x=>Array.isArray(x)?{__arr:enc(x)}:enc(x));if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=enc(v[k]);return o}return v}
function dec(v){if(Array.isArray(v))return v.map(dec);if(v&&typeof v==='object'){if(Array.isArray(v.__arr)&&Object.keys(v).length===1)return dec(v.__arr);const o={};for(const k in v)o[k]=dec(v[k]);return o}return v}
const snapData=s=>dec(structuredClone(s.data()));
const Store={mode:'cloud',
  init(){fb.app=initializeApp(firebaseConfig);fb.auth=getAuth(fb.app);fb.db=getFirestore(fb.app)},
  ref(p){return fsDoc(fb.db,...p.split('/'))},
  async retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await sleep(500+Math.random()*700);return await fn()}throw e}},
  _q(coll,w=[]){return fsQuery(fsCollection(fb.db,coll),...w.map(x=>fsWhere(...x)))},
  _post(rows,order,limit){if(order){const[f,dir]=order;rows.sort((a,b)=>((a[f]??0)>(b[f]??0)?1:(a[f]??0)<(b[f]??0)?-1:0)*(dir==='desc'?-1:1))}return limit?rows.slice(0,limit):rows},
  async get(p){return this.retry(async()=>{const s=await getDoc(this.ref(p));return s.exists()?{...snapData(s),_id:s.id}:null})},
  async set(p,d){return this.retry(()=>setDoc(this.ref(p),enc(clean(d))))},
  /* merge profundo: objetos aninhados se mesclam, listas são substituídas */
  async update(p,d){return this.retry(()=>setDoc(this.ref(p),enc(clean(d)),{merge:true}))},
  async del(p){return this.retry(()=>deleteDoc(this.ref(p)))},
  async query(coll,w=[],order=null,limit=null){return this.retry(async()=>{const s=await getDocs(this._q(coll,w));return this._post(s.docs.map(d=>({...snapData(d),_id:d.id})),order,limit)})},
  watch(coll,w,order,limit,cb){
    return onSnapshot(this._q(coll,w),s=>cb(this._post(s.docs.map(d=>({...snapData(d),_id:d.id})),order,limit)),
      e=>{console.warn(coll,e);if(e.code!=='permission-denied')toast('A conexão com a mesa caiu. Recarregue a página.','err')});
  },
  watchDoc(p,cb){return onSnapshot(this.ref(p),s=>cb(s.exists()?{...snapData(s),_id:s.id}:null),e=>console.warn(p,e))},
  async claim(){return true}
};
function errMsg(e){
  const c=(e&&e.code)||'';
  const M={
    'permission-denied':'Sem permissão para isso nesta mesa. Confira se você faz parte da campanha e se as regras do Firestore foram publicadas.',
    'resource-exhausted':'Muitas ações seguidas. Espere alguns segundos.',
    'unavailable':'Sem conexão com o servidor. Verifique a internet.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/missing-email':'Informe o e-mail.',
    'auth/user-not-found':'Não existe conta com esse e-mail.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Use “Entrar”.',
    'auth/weak-password':'A senha precisa de pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas. Espere um pouco e tente de novo.',
    'auth/network-request-failed':'Sem conexão. Verifique a internet.',
    'auth/operation-not-allowed':'O login por e-mail e senha não está ativado no Firebase (Authentication → Sign-in method).',
    'auth/unauthorized-domain':'Este domínio não está autorizado no Firebase (Authentication → Settings → Authorized domains).'
  };
  return M[c]||(e&&e.message)||'Algo deu errado. Tente de novo.';
}

  try{
    if(loginMode==='recuperar'){
      await sendPasswordResetEmail(fb.auth,email);
      err.style.color='var(--accent)';err.textContent='Se existir uma conta com esse e-mail, o link já está a caminho. Confira também o spam.';return;
    }
    const p=$('#lg-p').value;
    if(loginMode==='criar'){
      if(p.length<6){err.textContent='A senha precisa de pelo menos 6 caracteres.';return}
      if(p!==$('#lg-p2').value){err.textContent='As senhas não conferem.';return}
      const display=($('#lg-d').value||'').trim()||email.split('@')[0];
      signingUp=true;
      const cred=await createUserWithEmailAndPassword(fb.auth,email,p);
      await updateProfile(cred.user,{displayName:display}).catch(()=>{});
      st.user=await ensureProfile(cred.user,display);
      sendEmailVerification(cred.user).catch(()=>{});
      signingUp=false;toast('Conta criada. Enviamos um e-mail de confirmação.','ok');viewHome();
    }else{
      await signInWithEmailAndPassword(fb.auth,email,p);
    }
  }catch(e){signingUp=false;err.textContent=errMsg(e)}
  finally{if(btn.isConnected)btn.disabled=false}
}
async function doLogout(){if(st.sheetId)await flushSave();clearSubs();st.user=null;loginMode='entrar';await signOut(fb.auth)}
function merge(a,b){const o={...a};for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=merge(o[k],v);else o[k]=v}return o}

function openCampaign(code){
  if(st.sheetId)flushSave();
  clearSubs();Object.assign(st,{view:'camp',code,camp:null,sheets:[],rolls:[],rewards:[],sheetId:null,sheet:null,mtab:'mesa',rw:{sel:{},amt:{},all:'',reason:''}});
  st.dr.last=null;st.lastSeen=Date.now();
  renderShell();$('#view').innerHTML=LOADING('Abrindo os arquivos da campanha…');
  let first=true;
  subs.push(Store.watchDoc('campaigns/'+code,c=>{
    if(st.view!=='camp'||st.code!==code)return;
    if(!c){toast(first?'Campanha não encontrada.':'Esta campanha foi deletada.');viewHome();return}
    const u=st.user.uname;
    if(c.master!==u&&!(c.players||[]).includes(u)){toast('Você não faz parte desta campanha.');viewHome();return}
    st.camp=c;st.isMaster=c.master===u;
    if(first){first=false;st.tab=st.isMaster?'mestre':'mesa';renderCamp();startCampSubs()}
    else{renderCampHead();softRender()}
  }));
}
function startCampSubs(){
  const code=st.code;
  subs.push(Store.watch('sheets',st.isMaster?[['campaign','==',code]]:[['campaign','==',code],['owner','==',st.user.uname]],null,null,rows=>{st.sheets=rows.sort((a,b)=>(a.created||0)-(b.created||0));onSheets()}));
  subs.push(Store.watch('rolls',[['campaign','==',code]],['ts','desc'],80,rows=>{st.rolls=rows;renderLog()}));
  if(st.isMaster)subs.push(Store.watch('rewards',[['campaign','==',code]],null,null,rows=>{st.rewards=rows.sort((a,b)=>b.ts-a.ts);if(st.tab==='mestre'&&st.mtab==='rewards')softRender()}));
}
function softRender(){if(st.sheetId||st.view!=='camp')return;if(editingIn('#content')){pendingSoft=true;return}renderContent()}
function onSheets(){
  if(st.sheetId){const d=st.sheets.find(x=>x._id===st.sheetId);if(!d){toast('Esta ficha foi excluída.');st.sheetId=null;st.sheet=null;renderContent();return}sheetRemote(d)}

async function giveXP(){
  const rw=st.rw;const ids=Object.keys(rw.sel).filter(id=>rw.sel[id]&&st.sheets.some(s=>s._id===id));
  if(!ids.length)return toast('Marque ao menos uma ficha.','err');
  let n=0;
  for(const id of ids){
    const amt=parseInt(rw.amt[id]!==undefined&&rw.amt[id]!==''?rw.amt[id]:rw.all,10);if(!amt)continue;
    const s=st.sheets.find(x=>x._id===id);
    try{await Store.update('sheets/'+id,{xp:Math.max(0,(s.xp||0)+amt)});
      await Store.set('rewards/'+uid(),{campaign:st.code,sheetId:id,sheetName:s.name||'Sem nome',amount:amt,reason:rw.reason,by:st.user.uname,ts:Date.now(),kind:'xp',reverted:false});n++}
    catch(e){toast(errMsg(e),'err');break}
  }
  if(n){st.rw={sel:{},amt:{},all:'',reason:''};toast(`XP concedido a ${n} ficha(s).`,'ok');renderContent()}else toast('Informe a quantidade de XP.','err');
}

async function postRoll(r){

  <div class="log-list">${rolls.length?rolls.map(r=>`<div class="log-entry ${r.outcome||''} ${r.secret?'secret':''}"><div class="top"><span>${esc(r.byName||r.by)}${r.char?' · '+esc(r.char):''}</span><span class="num">${fmtTime(r.ts)}</span></div>
   <div class="lbl2">${esc(r.label||'Rolagem')}</div>${rollBody(r)}</div>`).join(''):`<p class="muted" style="padding:10px">Nenhuma rolagem ainda. As rolagens de todos aparecem aqui.</p>`}</div>

/* ===================== fichas ===================== */
function openSheet(id){
  const d=st.sheets.find(s=>s._id===id);if(!d)return toast('Ficha não encontrada.','err');
  if(d.type==='npc'&&!st.isMaster)return;
  st.sheetId=id;st.sheet=normSheet(d);st.dirty.clear();pendingSheet=false;
  st.rb={adv:0,dif:'',prof:false,secret:d.type==='npc'};
  renderSheet();window.scrollTo({top:($('#content')?.offsetTop||0)-80,behavior:'smooth'});
}
async function closeSheet(){await flushSave();st.sheetId=null;st.sheet=null;renderContent()}
const normSheet=d=>merge(d.type==='npc'?blankNPC():blankPC(),structuredClone(d));
const canEditSheet=s=>st.isMaster||(s.type==='pc'&&s.owner===st.user.uname);
function scheduleSave(){clearTimeout(st.saveT);setSaveState('Salvando…');st.saveT=setTimeout(flushSave,650)}
async function flushSave(){
  clearTimeout(st.saveT);if(!st.sheetId||!st.dirty.size)return;
  if(st.saving){st.saveAgain=true;return}
  st.saving=true;const id=st.sheetId,patch={updated:Date.now()};for(const k of st.dirty)patch[k]=st.sheet[k];st.dirty.clear();
  try{await Store.update('sheets/'+id,patch);setSaveState('Salvo')}catch(e){setSaveState('Não salvo');toast(errMsg(e),'err')}
  st.saving=false;if(st.saveAgain){st.saveAgain=false;flushSave()}
}
function setSaveState(t){const el=$('#save-st');if(el)el.textContent=t}
function touch(k){st.dirty.add(k.split('.')[0]);scheduleSave()}
function sheetRemote(d){
  const merged=normSheet(d);for(const k of st.dirty)merged[k]=st.sheet[k];
  const strip=o=>{const c={...o};delete c.updated;delete c._id;return JSON.stringify(c)};
  if(strip(merged)===strip(st.sheet))return;
  st.sheet=merged;if(editingIn('#sheet')){pendingSheet=true;return}renderSheet();
}
function calcPC(s){
  const a=s.attrs||{},ar=s.armor||{};const o={};
  for(const v of SAVES){const sv=(s.saves||{})[v.k]||{};o['save-'+v.k]=(a[v.a]||0)+(+sv.b||0)+(sv.p?(+s.prof||0):0)}
  o.def=Math.min(a.agi||0,ar.max??5)+(+ar.def||0)+(+s.defesaBonus||0);
  const bolsa=(BOLSAS.find(b=>b.k===s.bolsa)||BOLSAS[0]).v;
  o.leve=10+(a.cor||0)+bolsa;
  o.used=(s.itens||[]).reduce((t,i)=>t+(+i.c||0),0)+(s.armas||[]).reduce((t,i)=>t+(+i.c||0),0)+(+ar.c||0);
  const lv=o.used<=o.leve?0:o.used<=o.leve+5?1:o.used<=o.leve+10?2:3;
  o.lvl=['Leve','Média','Pesada','Máxima'][lv];o.lvlN=lv;o.pen=['Sem penalidade','Desvantagem em ataques · −1 Saúde/hora','Desvantagem em ataque e defesa · −2 Saúde/hora','Desvantagem em tudo · −3 Saúde/hora'][lv];
  o.over=o.used>o.leve+15;
  o.hpAt=s.saude.at;o.hpMax=s.saude.max;o.sanAt=s.sanidade.at;o.sanMax=s.sanidade.max;
  return o;
}
function refreshCalc(){
  const s=st.sheet;if(!s||s.type!=='pc')return;const c=calcPC(s);
  $$('#sheet [data-calc]').forEach(el=>{const k=el.dataset.calc;if(k in c)el.textContent=(/^save|^def/.test(k)?sgn(c[k]):c[k])});
  const pct=(x,y)=>y>0?clamp(x/y*100,0,100):0;
  const hb=$('#sheet [data-bar="hp"]');hb&&(hb.style.width=pct(s.saude.at,s.saude.max)+'%');
  const sb=$('#sheet [data-bar="san"]');sb&&(sb.style.width=pct(s.sanidade.at,s.sanidade.max)+'%');
  const tr=$('#carga-track');if(tr)tr.innerHTML=[0,1,2,3].map(i=>`<span class="${i<=c.lvlN?'on':''} ${c.lvlN>=2?'x':c.lvlN===1?'w':''}"></span>`).join('');
}
function syncField(k){const v=getPath(st.sheet,k);$$(`#sheet [data-k="${k}"]`).forEach(el=>{if(el.type==='checkbox')el.checked=!!v;else if(document.activeElement!==el)el.value=v??''});refreshCalc()}

/* --- rolagens da ficha --- */
function resetRB(){st.rb.adv=0;st.rb.prof=false;const rb=$('#rollbar');if(rb){$$('[data-act="adv"]',rb).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==='0'));const p=$('[data-rb="prof"]',rb);p&&(p.checked=false)}}
function rollTest({label,mods,nef=true,target}){
  const s=st.sheet,adv=st.rb.adv;const a=rnd(20),b=adv?rnd(20):null;
  const faces=[{v:a,s:20}];let nat=a;
  if(adv){faces.push({v:b,s:20});const keep=adv===1?(a>=b?0:1):(a<=b?0:1);faces[1-keep].drop=true;nat=faces[keep].v}
  mods=mods.filter(m=>m[1]!==0||m[0]==='');
  const nv=nef?rnd(6):null;if(nef)faces.push({v:nv,s:6,nef:true});
  const total=nat+mods.reduce((t,m)=>t+m[1],0);
  const tg=target!==undefined?target:(st.rb.dif!==''?+st.rb.dif:null);
  let outcome=null;if(nef){if(nat===20&&nv===6)outcome='triunfo';else if(nat===1&&nv===1)outcome='desespero';else if(nv===6)outcome='beneficio';else if(nv===1)outcome='ameaca'}
  const rec={kind:'test',label,char:s?s.name||null:null,faces,mods,total,nat,adv,outcome,target:tg,success:tg!=null?total>=tg:null,expr:'1d20'+(nef?' + d6 nefasto':''),secret:st.rb.secret};
  resetRB();postRoll(rec);return rec;
}
const profMod=()=>st.rb.prof&&st.sheet.prof?[['prof',+st.sheet.prof]]:[];
function rollAttr(k){const a=ATTRS.find(x=>x.k===k);const r=rollTest({label:'Teste de '+a.n,mods:[[a.n.slice(0,3).toUpperCase(),+st.sheet.attrs[k]||0],...profMod()]});showPop(r,outcomeActions(r))}
function rollSave(k,label){const v=SAVES.find(x=>x.k===k);const c=calcPC(st.sheet);const r=rollTest({label:label||v.n,mods:[[v.n,c['save-'+k]]]});return r}
function outcomeActions(r){
  if(RO())return'';
  if(r.outcome==='triunfo')return `<button class="btn xs" data-act="adj" data-k="determinacao" data-d="1">+1 Determinação</button>`;
  if(r.outcome==='desespero')return `<button class="btn xs" data-act="adj" data-k="determinacao" data-d="-1" data-min="0">−1 Determinação</button>`;
  return '';
}
function rollDmg(expr,label,crit,secret){
  const r=parseDice(expr);if(!r)return toast('Dano inválido: '+expr,'err');
  let total=r.total;if(crit)total*=2;
  const rec={kind:'damage',label:label+(crit?' (crítico ×2)':''),char:st.sheet?st.sheet.name:null,expr,faces:r.faces,mods:r.mods.filter(m=>m[1]),total:Math.max(0,total),secret};
  postRoll(rec);showPop(rec);
}
function weaponDmgExpr(w){const s=st.sheet;let e=(w.d||'1d4').replace(/\s/g,'');if(w.t==='prox'){const m=+s.attrs[w.a||'cor']||0;if(m)e+=(m>0?'+':'')+m}return e}
function rollTable(kind){
  let r,txt,label;
  if(kind==='curta'){r=rnd(100);txt=INS_CURTA.find(x=>r>=x[0]&&r<=x[1])[2];label='Insanidade de Curta Duração'}
  else if(kind==='longa'){r=rnd(100);txt=INS_LONGA.find(x=>r>=x[0]&&r<=x[1])[2];label='Insanidade de Longa Duração'}
  else if(kind==='perm'){r=rnd(20);txt=INS_PERM[r-1];label='Insanidade Permanente'}
  else{r=rnd(100);txt=FOBIAS[Math.ceil(r/2)-1];label='Fobia'}
  const dur=kind==='curta'?rnd(10)+' minutos':kind==='longa'?rnd(8)+' dias':'';
  const rec={kind:'table',label,char:st.sheet?st.sheet.name:null,faces:[{v:r,s:kind==='perm'?20:100}],mods:[],total:r,note:txt+(dur?` Duração: ${dur}.`:''),secret:st.rb.secret};
  postRoll(rec);
  showPop(rec,RO()?'':`<button class="btn xs primary" data-act="insadd" data-t="${kind}" data-x="${esc(txt+(dur?` (${dur})`:''))}">Adicionar à ficha</button>`);
}
function castModal(i){
  const s=st.sheet,f=s.feiticos[i];const lv=+f.l||1;
  const m=openModal({title:'Conjurar: '+(f.n||'feitiço'),body:`<p>Dificuldade <b class="num">${5+lv}</b> (5 + nível ${lv}). Role 1d6 e some dados extras pagos com pontos. Máximo de 5d6.</p>
   <div class="grid3"><div class="field"><label class="lbl" for="cs-h">Gastar Saúde</label><input id="cs-h" type="number" min="0" max="4" value="0"></div><div class="field"><label class="lbl" for="cs-s">Gastar Sanidade</label><input id="cs-s" type="number" min="0" max="4" value="0"></div><div class="field"><label class="lbl" for="cs-i">Gastar Inspiração</label><input id="cs-i" type="number" min="0" max="4" value="0"></div></div>
   <p class="hint">Saúde e Sanidade gastas não podem passar do seu nível (${esc(s.nivel||1)}). Cada dado com 1 ou 2 custa 1 de Sanidade e encerra as conjurações do dia.</p><div class="err" id="cs-e"></div>`,
   footer:`<button class="btn" data-x>Cancelar</button><button class="btn primary" id="cs-go">Conjurar</button>`});
  $('#cs-go',m.el).onclick=()=>{
    const h=+$('#cs-h',m.el).value||0,sn=+$('#cs-s',m.el).value||0,ins=+$('#cs-i',m.el).value||0;const ex=h+sn+ins;
    if(h<0||sn<0||ins<0||ex>4)return $('#cs-e',m.el).textContent='No máximo 4 dados extras (5d6 no total).';
    if(h+sn>(+s.nivel||1))return $('#cs-e',m.el).textContent='Saúde + Sanidade gastas não podem passar do seu nível.';
    if(ins>(+s.inspiracao||0))return $('#cs-e',m.el).textContent='Inspiração insuficiente.';
    m.close();
    if(!RO()){if(h)adjust('saude.at',-h,0);if(sn)adjust('sanidade.at',-sn,0);if(ins)adjust('inspiracao',-ins,0)}
    const faces=Array.from({length:1+ex},()=>({v:rnd(6),s:6}));const total=faces.reduce((t,f)=>t+f.v,0);const tg=5+lv;
    const low=faces.filter(f=>f.v<=2).length,ones=faces.filter(f=>f.v===1).length;const ok=total>=tg;
    let note=ok?'O feitiço funciona.':'A conjuração falha. Faça um teste de Vontade ou perca 1 de Sanidade.';
    if(low)note+=` ${low} dado(s) com 1 ou 2: perde ${low} de Sanidade e não conjura mais hoje.`;
    if(!ok&&ones>=2)note='FALHA CRÍTICA: o conjurador é devorado pelo que invocou, ou desaparece para outra dimensão. '+note;
    const rec={kind:'spell',label:'Conjurar: '+(f.n||'feitiço'),char:s.name,expr:(1+ex)+'d6',faces,mods:[],total,target:tg,success:ok,note,secret:st.rb.secret};
    postRoll(rec);showPop(rec,RO()?'':`${low?`<button class="btn xs" data-act="adj" data-k="sanidade.at" data-d="-${low}" data-min="0">−${low} Sanidade</button>`:''}${!ok?`<button class="btn xs" data-act="rsave2" data-s="vont">Teste de Vontade</button>`:''}`);
    if(!RO())renderSheet();
  };
}

function wzValidate(){
  const s=wz.step;
  if(s===0&&!wz.arq)return 'Escolha um arquétipo.';
  if(s===1&&wz.arq==='audaz'&&wz.audaz.length!==2)return 'Audaz: marque 2 atributos para o bônus.';
  if(s===2&&!wz.save)return 'Escolha uma salvaguarda proficiente.';
  if(s===3&&(wz.hp===''||wz.san===''))return 'Defina Saúde e Sanidade (role ou digite).';
  return '';
}
function wzRollAttrs(){
  wz.dice={};
  for(const a of ATTRS){
    if(wz.metodo==='4d6'){const v=rnd(6);wz.dice[a.k]=[v];wz.base[a.k]=v===1?-1:v<=3?0:v<=5?1:2}
    else{const d=[rnd(6),rnd(6),rnd(6)];wz.dice[a.k]=d;const six=d.filter(x=>x===6).length,five=d.filter(x=>x===5).length,one=d.filter(x=>x===1).length;
      let v=six+Math.max(0,five-one);if(one>=2&&six===0)v=-1;wz.base[a.k]=v}
  }
}
function wzRoll(f){
  const A=wzAttrs(),q=wzArq()||{};
  if(f==='prof'){const d=[rnd(6),rnd(6),rnd(6)];wz.profDice=d;wz.prof=Math.min(...d)}
  else if(f==='hp'){const r=best2of3();wz.hpDice=r;wz.hp=Math.max(1,r.v+A.cor+(q.saude||0))}
  else if(f==='san'){const r=best2of3();wz.sanDice=r;wz.san=Math.max(1,r.v+A.ast+(q.sanidade||0))}
  else if(f==='rec'){const d=[rnd(6),rnd(6),rnd(6)];wz.recDice=d;wz.rec=clamp([...d].sort((x,y)=>x-y)[1]-1,0,5)}
  else if(f==='virtude')wz.virtude=VIRTUDES[rnd(20)-1];
  else if(f==='vicio')wz.vicio=VICIOS[rnd(20)-1];
  else if(f==='motivacao')wz.motivacao=MOTIVACOES[rnd(12)-1][0];
  renderWz();
}
async function wzFinish(){
  if(!wz.name.trim())return $('#wz-e').textContent='Dê um nome ao investigador.';
  const q=wzArq()||{},A=wzAttrs(),s=blankPC();
  Object.assign(s,{name:wz.name.trim(),concept:wz.concept,arquetipo:wz.arq,profissao:wz.profissao,attrs:A,prof:+wz.prof||0,
    saude:{at:+wz.hp||0,max:+wz.hp||0},sanidade:{at:+wz.san||0,max:+wz.san||0},recursos:clamp(+wz.rec||0,0,5),determinacao:q.det||0,
    virtude:wz.virtude,vicio:wz.vicio,motivacao:wz.motivacao,historia:wz.historia,pericias:[...wz.pericias],idiomas:[...wz.idiomas],bolsa:wz.bolsa,owner:wz.owner||null});
  for(const v of SAVES)s.saves[v.k]={b:q.save===v.k?1:0,p:wz.save===v.k};
  s.armas=wz.armas.map(i=>{const w=ARMAS[i];return{id:uid(),nome:w.n,t:w.t,a:w.a,d:w.d,p:false,c:w.c,o:w.o||''}});
  if(wz.prot!==''){const p=PROTECOES[+wz.prot];s.armor={nome:p.n,def:p.def,max:p.max,c:p.c}}
  s.itens=wz.itens.map(i=>({id:uid(),n:ITENS[i][0],c:ITENS[i][1],o:ITENS[i][2]}));
  const m=wzM;wzM=null;m.close();wz=null;
  await createSheet(s);toast('Investigador criado.','ok');
}

  mnewpc:t=>{if(t.dataset.m==='wiz')startWizard('');else createSheet({...blankPC(),owner:null})},
  pcmode:t=>{const m=t.closest('.modal-bg');const owner=m.dataset.owner;m.remove();if(t.dataset.m==='wiz')startWizard(owner);else createSheet({...blankPC(),owner:owner||null})},
  npcnew:()=>createSheet(blankNPC()),
  npcbest:()=>{const i=$('#bst').value;if(i==='')return toast('Escolha um modelo no bestiário.','err');const b=BESTIARIO[+i];
    createSheet({...blankNPC(),name:b.name,desc:b.desc,attrs:{...b.attrs},insanidade:b.insanidade,defesa:b.defesa,saude:{at:b.saude,max:b.saude},prof:b.prof,
      ataques:b.ataques.map(a=>({id:uid(),n:a[0],v:a[1],b:a[2],d:a[3]})),resist:b.resist||'',fraq:b.fraq||'',especial:b.especial||''})},
  dupnpc:t=>{const s=st.sheets.find(x=>x._id===t.dataset.id);if(!s)return;const c=structuredClone(s);delete c._id;c.name=(c.name||'NPC')+' (cópia)';createSheet(c,{open:false}).then(()=>toast('NPC duplicado.','ok'))},
  opensheet:t=>openSheet(t.dataset.id),
  closesheet:()=>closeSheet(),
  delsheet:t=>delSheet(t.dataset.id),
  rwapply:()=>{const v=st.rw.all;Object.keys(st.rw.sel).forEach(id=>{if(st.rw.sel[id])st.rw.amt[id]=v});renderContent()},
  rwgive:()=>giveXP(),
  revert:t=>revertReward(t.dataset.id),
  resetxp:t=>resetXP(t.dataset.id),
  wipe:t=>wipeSheet(t.dataset.id),
  logtoggle:()=>{st.logOpen=!st.logOpen;lsSet('itm.logopen',st.logOpen);renderLog()},
  popx:()=>{const p=$('#pop');p&&(p.innerHTML='')},
  /* ficha */
  step:t=>{if(RO())return;const k=t.dataset.k;adjust(k,+t.dataset.d,+t.dataset.min,+t.dataset.max);if(k==='attrs.cor'||k==='attrs.agi')refreshCalc()},
  adj:t=>{if(!st.sheet||RO())return;adjust(t.dataset.k,+t.dataset.d,t.dataset.min!==undefined?+t.dataset.min:-999);toast('Ficha atualizada.','ok')},
  setrec:t=>{if(RO())return;st.sheet.recursos=+t.dataset.v;touch('recursos');renderSheet()},
  death:t=>{if(RO())return;const w=t.dataset.w,v=+t.dataset.v;st.sheet.morte[w]=st.sheet.morte[w]===v?v-1:v;touch('morte');renderSheet()},
  adv:t=>{st.rb.adv=+t.dataset.v;$$('[data-act="adv"]').forEach(b=>b.setAttribute('aria-pressed',b===t))},
  rattr:t=>rollAttr(t.dataset.a),
  rsave:t=>{const r=rollSave(t.dataset.s);showPop(r,outcomeActions(r))},
  rsave2:t=>{if(!st.sheet)return;const r=rollSave(t.dataset.s);showPop(r,outcomeActions(r))},
  rsan:()=>{const r=rollSave('vont','Teste de Sanidade (Vontade)');showPop(r,RO()?'':`<button class="btn xs" data-act="adj" data-k="sanidade.at" data-d="-1" data-min="0">−1 Sanidade</button><button class="btn xs" data-act="rins" data-t="curta">Insanidade curta</button>${outcomeActions(r)}`)},
  rdef:()=>{const c=calcPC(st.sheet);const r=rollTest({label:'Defesa',mods:[['Defesa',c.def]]});let note='';if(r.nat===20)note='20 natural: o inimigo sofre uma falha crítica.';if(r.nat===1)note='1 natural: como um 20 do inimigo, dano em dobro.';if(note){r.note=note}showPop(r,outcomeActions(r))},
  ratk:t=>{const w=st.sheet.armas[+t.dataset.i];const a=w.t==='dist'?'agi':(w.a||'cor');const mods=[[a.toUpperCase(),+st.sheet.attrs[a]||0]];if(w.p&&st.sheet.prof)mods.push(['prof',+st.sheet.prof]);
    const r=rollTest({label:'Ataque: '+(w.nome||'arma'),mods});
    showPop(r,`<button class="btn roll xs" data-act="rdmg" data-i="${t.dataset.i}">Rolar dano</button>${r.nat===20?`<button class="btn roll xs" data-act="rdmg" data-i="${t.dataset.i}" data-crit="1">Dano crítico ×2</button>`:''}${r.nat===1?'<span class="hint">1 natural: arma cai, desequilibra ou emperra (1d4 turnos).</span>':''}${outcomeActions(r)}`)},
  rdmg:t=>{const w=st.sheet.armas[+t.dataset.i];rollDmg(weaponDmgExpr(w),'Dano: '+(w.nome||'arma'),!!t.dataset.crit,st.rb.secret)},
  rdeath:()=>{const r=rollSave('fort','Teste de morte (Fortitude)');showPop(r,RO()?'':`<button class="btn xs" data-act="death" data-w="s" data-v="${Math.min(3,(st.sheet.morte.s||0)+1)}">Marcar sucesso</button><button class="btn xs" data-act="death" data-w="f" data-v="${Math.min(3,(st.sheet.morte.f||0)+1)}">Marcar falha</button>`)},
  rinj:()=>{const f=[rnd(6),rnd(6),rnd(6)];const tot=f[0]+f[1]+f[2];const row=DANO_FISICO.find(x=>tot>=x[0]&&tot<=x[1]);const rec={kind:'table',label:'Dano grave (3d6)',char:st.sheet.name,faces:f.map(v=>({v,s:6})),mods:[],total:tot,note:row[2]+' Ele tem 1d6 turnos para ser estabilizado (Astúcia 15).',secret:st.rb.secret};postRoll(rec);showPop(rec,RO()?'':`<button class="btn xs" data-act="injadd" data-x="${esc(row[2])}">Anotar em ferimentos</button>`)},
  injadd:t=>{if(RO())return;st.sheet.ferimentos=(st.sheet.ferimentos?st.sheet.ferimentos+'\n':'')+t.dataset.x;touch('ferimentos');syncField('ferimentos');toast('Anotado.','ok')},
  rest:t=>{const s=st.sheet;let g;if(t.dataset.t==='curto')g=Math.max(1,+s.attrs.cor||0);else g=rnd(4);const before=s.saude.at;s.saude.at=Math.min(s.saude.max,s.saude.at+g);touch('saude');syncField('saude.at');
    postRoll({kind:'rest',label:t.dataset.t==='curto'?'Descanso curto':'Descanso longo (1d4)',char:s.name,faces:t.dataset.t==='curto'?[]:[{v:g,s:4}],mods:t.dataset.t==='curto'?[['Corpo',g]]:[],total:s.saude.at-before,note:`Saúde ${before} → ${s.saude.at}`})},
  rins:t=>rollTable(t.dataset.t),
  insadd:t=>{if(RO())return;st.sheet.insanidades.push({id:uid(),t:t.dataset.t,x:t.dataset.x});touch('insanidades');renderSheet();toast('Insanidade anotada.','ok')},
  rtab:t=>{const f=t.dataset.t;if(f==='virtude')st.sheet.virtude=VIRTUDES[rnd(20)-1];else if(f==='vicio')st.sheet.vicio=VICIOS[rnd(20)-1];else st.sheet.motivacao=MOTIVACOES[rnd(12)-1][0];touch(f);renderSheet()},
  ruse:t=>{const it=st.sheet.itens[+t.dataset.i];const m=(it.o||'').match(/(\d*)d(\d+)/i);const sd=+m[2];const v=rnd(sd);const rec={kind:'use',label:'Dado de uso: '+it.n,char:st.sheet.name,faces:[{v,s:sd}],mods:[],total:v,note:v<=2?'Último uso! Precisa de outro.':'Ainda funciona.',secret:st.rb.secret};postRoll(rec);showPop(rec)},
  cast:t=>castModal(+t.dataset.i),
  levelup:()=>levelUpModal(),
  rm:t=>{if(RO())return;const l=t.dataset.l;st.sheet[l].splice(+t.dataset.i,1);touch(l);renderSheet()},
  addcustom:t=>{const l=t.dataset.l;const n={armas:{id:uid(),nome:'',t:'prox',a:'cor',d:'1d6',p:false,c:1,o:''},itens:{id:uid(),n:'',c:1,o:''},insanidades:{id:uid(),t:'curta',x:''},ataques:{id:uid(),n:'',v:13,b:3,d:'1d6'}}[l];st.sheet[l].push(n);touch(l);renderSheet()},
  addarma:()=>{const i=$('#add-arma').value;if(i==='')return;const w=ARMAS[+i];st.sheet.armas.push({id:uid(),nome:w.n,t:w.t,a:w.a,d:w.d,p:false,c:w.c,o:w.o||''});touch('armas');renderSheet()},
  additem:()=>{const i=$('#add-item').value;if(i==='')return;const it=ITENS[+i];st.sheet.itens.push({id:uid(),n:it[0],c:it[1],o:it[2]});touch('itens');renderSheet()},
  addspell:()=>{const i=$('#add-spell').value;if(i==='')return;const f=FEITICOS[+i];st.sheet.feiticos.push({id:uid(),n:f[0],l:f[1],d:f[2]});touch('feiticos');renderSheet()},
  setprot:()=>{const i=$('#add-prot').value;if(i==='')return;const p=PROTECOES[+i];st.sheet.armor={nome:p.n,def:p.def,max:p.max,c:p.c};touch('armor');renderSheet()},
  addchip:t=>{const inp=$('#'+t.dataset.src);const v=inp.value.trim();if(!v)return;st.sheet[t.dataset.l].push(v);touch(t.dataset.l);renderSheet()},
  rnattr:t=>{const a=ATTRS.find(x=>x.k===t.dataset.a);const r=rollTest({label:(st.sheet.name||'NPC')+': '+a.n,mods:[[a.n.slice(0,3).toUpperCase(),+st.sheet.attrs[a.k]||0]],nef:false});showPop(r)},
  rnatk:t=>{const a=st.sheet.ataques[+t.dataset.i];const r=rollTest({label:(st.sheet.name||'NPC')+': '+(a.n||'ataque'),mods:[['bônus',+a.b||0]],nef:false});r.note=`Valor fixo: ${a.v}. O jogador rola Defesa contra ele.`;showPop(r,`<button class="btn roll xs" data-act="rndmg" data-i="${t.dataset.i}">Rolar dano</button>`)},
  rndmg:t=>{const a=st.sheet.ataques[+t.dataset.i];rollDmg(String(a.d||'1d6'),(st.sheet.name||'NPC')+': dano de '+(a.n||'ataque'),false,st.rb.secret)},
  rnpcsan:()=>{const e=st.sheet.insanidade||'';const r=parseDice(e);if(!r)return toast('Informe a insanidade como dado, ex: 1d4.','err');const rec={kind:'free',label:'Perda de Sanidade: '+(st.sheet.name||'NPC'),expr:e,faces:r.faces,mods:r.mods.filter(m=>m[1]),total:r.total,secret:st.rb.secret};postRoll(rec);showPop(rec)},
  /* assistente */
  wzset:t=>{const f=t.dataset.f;wz[f]=t.dataset.v;if(f==='arq'&&wz.arq!=='audaz')wz.audaz=[];if(f==='metodo'){wz.dice=null;wz.base={cor:0,agi:0,ast:0,pre:0}}renderWz()},
  wzstep:t=>{const k=t.dataset.a;wz.base[k]=clamp(wz.base[k]+(+t.dataset.d),-3,5);renderWz()},
  wzrollattr:()=>{wzRollAttrs();renderWz()},
  wzroll:t=>wzRoll(t.dataset.f),
  wzprof:t=>{wz.profissao=t.dataset.v;const p=PROFISSOES.find(x=>x[0]===wz.profissao);wz.pericias=p[1].split(/,\s*(?![^()]*\))/).map(x=>x.trim()).filter(Boolean);renderWz()},
  wzadd:t=>{const v=$('#'+t.dataset.src).value.trim();if(!v)return;wz[t.dataset.l].push(v);renderWz()},
  wzrm:t=>{wz[t.dataset.l].splice(+t.dataset.i,1);renderWz()},
  wzname:t=>{const g=t.dataset.g;if(g==='s'){const sn=SOBRENOMES[rnd(100)-1];wz.name=(wz.name.split(' ')[0]||'')+(wz.name?' ':'')+sn}else{const n=g==='f'?NOMES_F[rnd(12)+rnd(12)]:NOMES_M[rnd(12)+rnd(12)+rnd(12)];const parts=wz.name.split(' ');parts[0]=n;wz.name=parts.join(' ')}renderWz()},
  wznav:t=>{const d=+t.dataset.d;if(d>0){const e=wzValidate();if(e)return $('#wz-e').textContent=e}wz.step=clamp(wz.step+d,0,WZ_STEPS.length-1);renderWz();wzM.el.scrollTop=0},
  wzdone:()=>wzFinish()
};
function selCode(){const el=$('#camp-code');if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Código selecionado. Copie com Ctrl+C.')}
function updDr(){const p=$('#dr-preview');p&&(p.textContent=drExpr())}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const fn=ACT[t.dataset.act];if(!fn)return;
  if(t.tagName==='INPUT')return;e.preventDefault();
  try{const r=fn(t,e);r&&r.catch&&r.catch(x=>toast(errMsg(x),'err'))}catch(x){console.error(x);toast(errMsg(x),'err')}
});
const INP={
  drn:t=>{st.dr.n=clamp(parseInt(t.value)||1,1,100);updDr()},drm:t=>{st.dr.mod=parseInt(t.value)||0;updDr()},drl:t=>{st.dr.label=t.value},dre:t=>{st.dr.expr=t.value;$$('[data-act="drs"]').forEach(b=>b.setAttribute('aria-pressed',!t.value.trim()&&+b.dataset.s===st.dr.s));updDr()},
  rwall:t=>{st.rw.all=t.value},rwr:t=>{st.rw.reason=t.value},rwamt:t=>{st.rw.amt[t.dataset.id]=t.value}
};
const CHG={
  drsec:t=>{st.dr.secret=t.checked},
  owner:async t=>{try{await Store.update('sheets/'+t.dataset.id,{owner:t.value||null});if(st.sheet&&st.sheetId===t.dataset.id)st.sheet.owner=t.value||null;toast('Ficha atribuída a '+(t.value?nameOf(t.value):'ninguém')+'.','ok')}catch(e){toast(errMsg(e),'err')}},
  rwsel:t=>{st.rw.sel[t.dataset.id]=t.checked},
  rwselall:t=>{st.sheets.filter(s=>s.type==='pc').forEach(s=>st.rw.sel[s._id]=t.checked);renderContent()},
  wzaudaz:t=>{const k=t.dataset.a;if(t.checked){if(wz.audaz.length>=2){t.checked=false;return toast('O Audaz escolhe só 2 atributos.')}wz.audaz.push(k)}else wz.audaz=wz.audaz.filter(x=>x!==k);renderWz()},
  wzarma:t=>{const i=+t.dataset.i;wz.armas=t.checked?[...wz.armas,i]:wz.armas.filter(x=>x!==i)},
  wzitem:t=>{const i=+t.dataset.i;wz.itens=t.checked?[...wz.itens,i]:wz.itens.filter(x=>x!==i)}
};
function sheetInput(t){
  if(!st.sheet||RO())return;const k=t.dataset.k;let v;
  if(t.type==='checkbox')v=t.checked;else if(t.dataset.t==='n'){v=parseInt(t.value,10);if(isNaN(v))v=0}else v=t.value;
  if(k==='xp'&&!st.isMaster)return;
  setPath(st.sheet,k,v);touch(k);refreshCalc();
  if(k==='arquetipo'||k==='motivacao'){if(!editingIn('#sheet'))renderSheet()}
}
document.addEventListener('input',e=>{
  const t=e.target;if(t.type==='checkbox')return;
  if(t.dataset.k&&t.closest('#sheet'))return sheetInput(t);
  if(t.dataset.inp&&INP[t.dataset.inp])return INP[t.dataset.inp](t);
  if(t.dataset.wz&&wz){wz[t.dataset.wz]=t.value;if(t.tagName==='SELECT')renderWz();return}
  if(t.dataset.rb){st.rb[t.dataset.rb]=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='checkbox'&&t.dataset.k&&t.closest('#sheet'))return sheetInput(t);
  if(t.dataset.chg&&CHG[t.dataset.chg])return CHG[t.dataset.chg](t);
  if(t.dataset.rb&&t.type==='checkbox'){st.rb[t.dataset.rb]=t.checked}
  if(t.tagName==='SELECT'&&t.dataset.k&&t.closest('#sheet')&&(t.dataset.k==='arquetipo'||t.dataset.k==='motivacao'))renderSheet();
});
addEventListener('beforeunload',()=>{if(st.sheetId)flushSave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st.sheetId)flushSave()});

/* ===================== início ===================== */
(function boot(){
  applyTheme();
  $('#app').innerHTML=LOADING('Acendendo as velas…');
  Store.init();
  onAuthStateChanged(fb.auth,async u=>{
    if(signingUp)return;
    if(u){
      try{st.user=await ensureProfile(u)}catch(e){console.warn(e);st.user={uname:u.uid,display:u.displayName||u.email,email:u.email}}
      if(st.view==='boot'||st.view==='login')viewHome();
    }else{st.user=null;if(st.view!=='login')viewLogin()}
  });
})();

</script>
</body>
</html>
